name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

      - name: Check formatting and lint rules
        run: npx prettier --check "src/**/*.ts" && npx eslint "src/**/*.ts"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies for E2E
        working-directory: ${{ github.workspace }}/backend
        run: npm ci

      - name: Start backend for E2E tests
        working-directory: ${{ github.workspace }}
        env:
          PORT: 3000
          CORS_ORIGIN: http://127.0.0.1:3001
          SF_LOGIN_URL: https://login.salesforce.com
          SF_CLIENT_ID: ci-placeholder-client-id
          SF_CLIENT_SECRET: ci-placeholder-client-secret
          SF_API_VERSION: 60.0
        run: |
          npm --prefix backend run build
          npm --prefix backend run start:prod > /tmp/salesforce-manager-backend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salesforce-manager-backend.log
          exit 1

      - name: Run end-to-end tests
        env:
          CI: true
        run: npx playwright test

  containers:
    name: Build container images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: salesforce-manager-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://127.0.0.1:3000
          tags: salesforce-manager-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
